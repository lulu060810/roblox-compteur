<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;max-height:100vh;margin:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script>
// ===== UNITED GAMES × NOKSO — vertical teaser (19 s) =====
// Design space 1080 x 1920, rendered at RES x (2 → 2160 x 3840, 4K vertical).
const Q = new URLSearchParams(location.search);
const RES = +(Q.get('res') || 2);
const DURATION = 19;
window.DURATION = DURATION;
const W = 1080, H = 1920;
const cv = document.getElementById('c');
cv.width = W * RES; cv.height = H * RES;
const ctx = cv.getContext('2d');

const RED = '#ff2244', BLUE = '#2b8cff';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eInExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const eOutQuart = k => 1 - Math.pow(1 - k, 4);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eInOutSine = k => -(Math.cos(Math.PI * k) - 1) / 2;
const pulse = (t, t0, rise, decay) => t < t0 - rise ? 0 : t < t0 ? Math.pow((t - t0 + rise) / rise, 2) : Math.exp(-(t - t0) / decay);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- timeline (seconds) ----------
const T = {
  red0: 0.7, red1: 2.1, blue0: 1.5, blue1: 2.9,
  hits: [3.1, 3.7, 4.3], collapse0: 4.55, flash: 5.0,
  ug0: 5.05, ug1: 6.75, nk0: 5.45, nk1: 7.15, cross: 7.9,
  orb0: 8.6, txt1: 9.4, txt1out: 11.5, txt2: 11.85, txt2out: 14.0,
  wipe: 14.25, fin: 14.75, title: 15.3, cred1: 15.9, cred2: 16.2, soon: 16.8, final: 17.9, end: 19
};

// ---------- assets ----------
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sprite(color, size = 256, core = 0.06) {
  const c = mk(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(core, color);
  gr.addColorStop(0.3, color + '50'); gr.addColorStop(0.65, color + '14'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
function softDisc(color, size = 128) { // out-of-focus bokeh disc
  const c = mk(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, color + '55'); gr.addColorStop(0.75, color + '40'); gr.addColorStop(0.92, color + '22'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const FS = 1024; // face canvas size; logo fitted & centred in it
function fitted(img, fill) {
  const c = mk(FS, FS), g = c.getContext('2d');
  const k = FS / Math.max(img.width, img.height);
  g.drawImage(img, (FS - img.width * k) / 2, (FS - img.height * k) / 2, img.width * k, img.height * k);
  if (fill) { g.globalCompositeOperation = 'source-in'; g.fillStyle = fill(g); g.fillRect(0, 0, FS, FS); }
  return c;
}
function blurred(src, color, blur, pad = 0.4) {
  const s = 512, p = Math.round(s * pad), c = mk(s + 2 * p, s + 2 * p), g = c.getContext('2d');
  const tmp = mk(s, s), tg = tmp.getContext('2d');
  tg.drawImage(src, 0, 0, s, s); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = color; tg.fillRect(0, 0, s, s);
  g.filter = `blur(${blur}px)`; g.drawImage(tmp, p, p); g.drawImage(tmp, p, p);
  return { c, pad };
}
let IMG = {}, SP = {}, offFace = {}, small1, small2, grain;

// ---------- particles: dust motes + bokeh ----------
const R0 = rng(11);
const DUST = Array.from({ length: 110 }, () => ({ x: R0() * 1080, y: R0() * 1920, z: 0.4 + R0(), ph: R0() * 6.28, c: R0() }));
const BOKEH = Array.from({ length: 26 }, () => ({ x: R0() * 1300 - 110, y: R0() * 2100 - 90, s: 60 + R0() * 170, z: 0.3 + R0() * 1.4, ph: R0() * 6.28, c: R0() < .5 ? 0 : 1 }));

// ---------- camera ----------
function camera(t) {
  let z = 1, r = 0, x = 0, y = 0;
  if (t < T.flash) {
    z = lerp(1.0, 1.12, eInOutSine(prog(t, 0, T.collapse0)));
    for (const h of T.hits) z += 0.025 * pulse(t, h, .03, .35);
    z *= 1 + 0.9 * eInExpo(prog(t, T.collapse0, T.flash));
    r = lerp(-1.2, 1.2, t / T.flash) * Math.PI / 180;
  } else if (t < T.wipe) {
    const a = eOutCubic(prog(t, T.flash, T.cross));
    z = lerp(1.1, 1.0, a) + 0.02 * pulse(t, T.cross, .02, .5);
    const d = eInOutSine(prog(t, T.cross, T.wipe));
    z += 0.06 * d; r = lerp(0.8, 0, a) * Math.PI / 180 + lerp(0, -1.1, d) * Math.PI / 180;
    x = lerp(0, -10, d); y = lerp(0, 12, d);
    z *= 1 + 0.6 * eInExpo(prog(t, T.wipe - 0.25, T.fin));
  } else {
    z = lerp(1.08, 1.0, eOutCubic(prog(t, T.fin, T.fin + 2.2))) + 0.02 * pulse(t, T.final, .02, .6);
    z += 0.025 * prog(t, T.fin + 2.2, T.end);
  }
  for (const [ti, a] of [[T.cross, 7], [T.flash, 4], [T.final, 5]]) if (t > ti) {
    const d = Math.exp(-(t - ti) * 9) * a;
    x += Math.sin(t * 61 + ti) * d; y += Math.cos(t * 53 + ti * 3) * d;
  }
  return { z, r, x, y };
}

// ---------- drawing helpers ----------
function spr(img, x, y, size, a) { if (a <= 0.003 || size <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(img, x - size / 2, y - size / 2, size, size); ctx.globalAlpha = 1; }

function background(t) {
  ctx.fillStyle = '#020206'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const amb = clamp(prog(t, 0.5, 3.5) * 0.6 + prog(t, T.flash, T.flash + 1) * 0.4) * (1 - 0.6 * prog(t, T.end - 0.6, T.end));
  const b = 0.85 + 0.15 * Math.sin(t * 0.9);
  let g = ctx.createRadialGradient(-60, 1650, 0, -60, 1650, 1250);
  g.addColorStop(0, `rgba(255,24,60,${0.22 * amb * b})`); g.addColorStop(1, 'rgba(255,24,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(1140, 260, 0, 1140, 260, 1250);
  g.addColorStop(0, `rgba(30,120,255,${0.24 * amb * (1.7 - b)})`); g.addColorStop(1, 'rgba(30,120,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

// volumetric light beams from above
function beams(t, amt) {
  if (amt <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const srcs = [[150, -260, '255,40,70', 0.25], [930, -260, '50,140,255', -0.25]];
  for (const [sx, sy, col, base] of srcs) {
    for (let i = 0; i < 3; i++) {
      const ang = base + (i - 1) * 0.16 + Math.sin(t * 0.35 + i * 2 + sx) * 0.07;
      const len = 2300, wid = 0.05 + i * 0.015;
      const ex = sx + Math.sin(ang) * len, ey = sy + Math.cos(ang) * len;
      const g = ctx.createLinearGradient(sx, sy, ex, ey);
      g.addColorStop(0, `rgba(${col},${0.20 * amt})`); g.addColorStop(0.45, `rgba(${col},${0.06 * amt})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.sin(ang - wid) * len, sy + Math.cos(ang - wid) * len);
      ctx.lineTo(sx + Math.sin(ang + wid) * len, sy + Math.cos(ang + wid) * len); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function particles(t, cam) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const vis = prog(t, 0.3, 2.5) * (1 - prog(t, T.end - 0.5, T.end));
  for (const p of BOKEH) {
    let x = p.x + Math.sin(t * 0.25 + p.ph) * 30 * p.z, y = ((p.y - t * 9 * p.z) % 2100 + 2100) % 2100 - 90;
    x += (x - 540) * (cam.z - 1) * p.z; y += (y - 960) * (cam.z - 1) * p.z;
    spr(p.c ? SP.bokB : SP.bokR, x, y, p.s * (0.7 + p.z * 0.4), (0.25 + 0.15 * Math.sin(t + p.ph)) * vis * 0.55);
  }
  for (const p of DUST) {
    let x = p.x + Math.sin(t * 0.4 + p.ph) * 20, y = ((p.y - t * 14 * p.z) % 1920 + 1920) % 1920;
    x += (x - 540) * (cam.z - 1) * p.z * 0.8; y += (y - 960) * (cam.z - 1) * p.z * 0.8;
    const tw = 0.5 + 0.5 * Math.sin(t * 1.7 + p.ph * 5);
    spr(p.c < .4 ? SP.r : p.c < .75 ? SP.b : SP.w, x, y, 7 + 9 * p.z, (0.15 + 0.4 * tw) * vis);
  }
  ctx.restore();
}

// light line with anamorphic head
function lightLine(y, x0, x1, k, col, sprite, fade, dir) {
  if (k <= 0) return;
  const hx = lerp(x0, x1, eInOut(k));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  // persistent filament
  const g = ctx.createLinearGradient(x0, 0, hx, 0);
  g.addColorStop(0, `rgba(${col},${0.0})`); g.addColorStop(0.35, `rgba(${col},${0.55 * fade})`); g.addColorStop(1, `rgba(255,255,255,${0.95 * fade})`);
  ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(hx, y); ctx.stroke();
  ctx.lineWidth = 9; ctx.globalAlpha = 0.25; ctx.stroke(); ctx.globalAlpha = 1;
  if (k < 1) {
    spr(sprite, hx, y, 260, 1); spr(SP.w, hx, y, 60, 1);
    flare(hx, y, 900, col, 0.8);
  }
  ctx.restore();
}
function flare(x, y, w, col, a) { // horizontal anamorphic streak
  if (a <= 0.01) return;
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - w / 2, y - 1.5, w, 3);
  ctx.globalAlpha = a * 0.35; ctx.fillRect(x - w / 2, y - 6, w, 12); ctx.globalAlpha = 1;
}

// thin 3D ring (tilted circle) with a travelling comet
function ring3D(cx, cy, R, tilt, rotZ, col, a, head, lw = 1.6) {
  if (a <= 0.01) return;
  const ry = R * Math.abs(Math.cos(tilt));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${col},${0.35 * a})`; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.ellipse(cx, cy, R, ry, rotZ, 0, Math.PI * 2); ctx.stroke();
  // comet arc
  const N = 40, span = 1.6;
  for (let i = 0; i < N; i++) {
    const a1 = head - span * i / N, a2 = head - span * (i + 1) / N, f = 1 - i / N;
    ctx.strokeStyle = `rgba(${col},${f * f * a})`; ctx.lineWidth = lw + 3.5 * f * f;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, ry, rotZ, a2, a1); ctx.stroke();
  }
  const hx = cx + Math.cos(head) * R * Math.cos(rotZ) - Math.sin(head) * ry * Math.sin(rotZ);
  const hy = cy + Math.cos(head) * R * Math.sin(rotZ) + Math.sin(head) * ry * Math.cos(rotZ);
  spr(col.startsWith('255,4') ? SP.r : col.startsWith('50') ? SP.b : SP.w, hx, hy, 110, a);
  ctx.restore();
}

// ---------- logos (extruded 3D) ----------
function face(which, shine) {
  const off = offFace[which], g = off.getContext('2d');
  g.globalCompositeOperation = 'copy'; g.drawImage(IMG[which].face, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  if (shine != null && shine > -0.1 && shine < 1.1) {
    const p = lerp(-0.5, 1.5, shine) * FS;
    const gr = g.createLinearGradient(p - FS * 0.3, FS * 0.1, p + FS * 0.3, FS * 0.6);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, FS, FS);
  }
  g.globalCompositeOperation = 'source-over';
  return off;
}
function logo3D(which, cx, cy, size, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0.003) return;
  const ry = o.rotY || 0, sx = Math.max(0.03, Math.cos(ry)), sk = Math.sin(ry) * 0.14;
  const I = IMG[which], depth = size * (o.depth ?? 0.075);
  ctx.save(); ctx.translate(cx, cy);
  if (o.blur > 0.3) ctx.filter = `blur(${(o.blur * RES).toFixed(1)}px)`;
  // back glow (rim light)
  if (o.glow > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const gs = size * (1 + 2 * I.glow.pad);
    ctx.globalAlpha = clamp(o.glow * a); ctx.drawImage(I.glow.c, -gs / 2 - Math.sin(ry) * depth, -gs / 2 + depth * 0.2, gs, gs);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // extrusion (side walls)
  const n = 18;
  for (let i = n; i >= 1; i--) {
    const f = i / n;
    ctx.save(); ctx.translate(-Math.sin(ry) * depth * f, depth * 0.2 * f); ctx.transform(sx, sk, 0, 1, 0, 0);
    ctx.globalAlpha = a; ctx.drawImage(i <= 2 ? I.sideHi : I.side, -size / 2, -size / 2, size, size); ctx.restore();
  }
  // front face
  ctx.transform(sx, sk, 0, 1, 0, 0); ctx.globalAlpha = a;
  ctx.drawImage(face(which, o.shine), -size / 2, -size / 2, size, size);
  ctx.restore();
}

function crossX(cx, cy, s, a, glowA = 1) {
  if (a <= 0.01) return;
  ctx.save(); ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';
  spr(SP.r, -s * 0.35, -s * 0.15, s * 5, 0.5 * a * glowA); spr(SP.b, s * 0.35, s * 0.15, s * 5, 0.5 * a * glowA);
  ctx.lineCap = 'butt';
  const L = s / 2;
  ctx.globalAlpha = a * 0.8; ctx.lineWidth = s * 0.2;
  ctx.strokeStyle = RED; ctx.beginPath(); ctx.moveTo(-L, -L); ctx.lineTo(L, L); ctx.stroke();
  ctx.strokeStyle = BLUE; ctx.beginPath(); ctx.moveTo(L, -L); ctx.lineTo(-L, L); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.085;
  ctx.beginPath(); ctx.moveTo(-L, -L); ctx.lineTo(L, L); ctx.moveTo(L, -L); ctx.lineTo(-L, L); ctx.stroke();
  ctx.restore();
}
function shock(cx, cy, t, t0, R, col, dur = 1.4, w = 3) {
  const k = prog(t, t0, t0 + dur); if (k <= 0 || k >= 1) return;
  const e = eOutExpo(k);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${col},${(1 - k) * 0.8})`; ctx.lineWidth = w * (1 - k) + 0.6;
  ctx.beginPath(); ctx.arc(cx, cy, R * e, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// orbiting comets around the pair (3D ellipse, front/back split)
function orbits(t, cx, cy, amt, front) {
  if (amt <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const defs = [
    { rx: 560, ry: 175, tilt: -0.10, sp: 0.95, a0: 0.4, c: '255,40,70', s: 'r' },
    { rx: 520, ry: 250, tilt: 0.14, sp: -0.75, a0: 2.4, c: '50,140,255', s: 'b' },
  ];
  for (const d of defs) {
    const head = d.a0 + d.sp * t, N = 60, span = 2.6, ct = Math.cos(d.tilt), st = Math.sin(d.tilt);
    const pt = a => { const x = Math.cos(a) * d.rx, y = Math.sin(a) * d.ry; return [cx + x * ct - y * st, cy + x * st + y * ct, Math.sin(a)]; };
    for (let i = 0; i < N; i++) {
      const a1 = head - Math.sign(d.sp) * span * i / N, a2 = head - Math.sign(d.sp) * span * (i + 1) / N;
      const p1 = pt(a1), p2 = pt(a2);
      if ((p1[2] > 0) !== front) continue;
      const f = 1 - i / N;
      ctx.strokeStyle = `rgba(${d.c},${f * f * amt * (front ? 0.9 : 0.4)})`; ctx.lineWidth = 0.8 + 4 * f * f;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    }
    const h = pt(head);
    if ((h[2] > 0) === front) { spr(SP[d.s], h[0], h[1], 150, amt); spr(SP.w, h[0], h[1], 30, amt); }
    if (front) { ctx.strokeStyle = `rgba(${d.c},${0.06 * amt})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(cx, cy, d.rx, d.ry, d.tilt, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------- typography: masked line reveals ----------
const FONT = '"Inter Display", "Inter", sans-serif';
function measure(str, size, weight, tr) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const ch = [...str], ws = ch.map(c => ctx.measureText(c).width);
  return { ch, ws, total: ws.reduce((a, b) => a + b, 0) + tr * size * (ch.length - 1) };
}
function fit(str, size, weight, tr, maxW) { let s = size; while (s > 8 && measure(str, s, weight, tr).total > maxW) s -= 1; return s; }
// pIn/pOut in [0..1]; words slide up from behind a mask; letters tracked manually
function maskLine(str, cx, cy, size, weight, o = {}) {
  const tr = o.tr ?? 0.04, pIn = o.pIn ?? 1, pOut = o.pOut ?? 0;
  if (pIn <= 0 || pOut >= 1) return;
  const { ch, ws, total } = measure(str, size, weight, tr);
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - total / 2 - size, cy - size * 0.78, total + size * 2, size * 1.56); ctx.clip();
  ctx.textBaseline = 'middle'; ctx.font = `${weight} ${size}px ${FONT}`;
  // word index for stagger
  let wi = 0; const widx = ch.map(c => { const r = wi; if (c === ' ') wi++; return r; });
  const nW = wi + 1;
  let x = cx - total / 2;
  for (let i = 0; i < ch.length; i++) {
    const st = (o.stagger ?? 0.12) * widx[i];
    const kin = eOutQuart(clamp((pIn * (1 + (o.stagger ?? 0.12) * (nW - 1)) - st)));
    const kout = eInCubic(clamp((pOut * (1 + 0.06 * (nW - 1)) - 0.06 * widx[i])));
    const dy = (1 - kin) * size * 1.25 - kout * size * 1.25;
    ctx.globalAlpha = (o.alpha ?? 1) * clamp(kin * 1.4) * (1 - kout * 0.5);
    ctx.fillStyle = (o.colorAt && o.colorAt(i)) || o.color || '#fff';
    ctx.fillText(ch[i], x, cy + dy);
    x += ws[i] + tr * size;
  }
  ctx.restore();
  return total;
}
function accentLine(cx, cy, w, p, a = 1) {
  if (p <= 0 || a <= 0) return;
  const hw = w / 2 * eOutQuart(p);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(cx - hw, 0, cx + hw, 0);
  g.addColorStop(0, 'rgba(255,34,68,0)'); g.addColorStop(0.3, RED); g.addColorStop(0.5, '#fff'); g.addColorStop(0.7, BLUE); g.addColorStop(1, 'rgba(43,140,255,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - hw, cy - 1, hw * 2, 2);
  ctx.restore();
}

// ---------- post: bloom + grain ----------
function post(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const [sm, blur, amt] of [[small1, 6, 0.32], [small2, 10, 0.38]]) {
    const g = sm.getContext('2d');
    g.globalCompositeOperation = 'copy'; g.filter = `blur(${blur}px)`;
    g.drawImage(cv, 0, 0, sm.width, sm.height); g.filter = 'none';
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = amt;
    ctx.drawImage(sm, 0, 0, cv.width, cv.height);
  }
  ctx.globalAlpha = 1;
  // vignette
  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  const v = ctx.createRadialGradient(540, 960, 420, 540, 960, 1280);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // film grain
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const f = Math.floor(t * 30);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.22;
  ctx.translate(-(f * 137 % 256), -(f * 91 % 256));
  ctx.fillStyle = grain; ctx.fillRect(0, 0, cv.width + 256, cv.height + 256);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- main render ----------
const LY = 840, UGX = 292, NKX = 788, LS = 420;
function render(t) {
  ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.filter = 'none';
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const cam = camera(t);
  background(t);
  ctx.save();
  ctx.translate(540 + cam.x, 960 + cam.y); ctx.rotate(cam.r); ctx.scale(cam.z, cam.z); ctx.translate(-540, -960);

  beams(t, prog(t, T.flash, T.flash + 1.5) * (1 - 0.5 * prog(t, T.wipe - .3, T.wipe)) + 0.6 * prog(t, T.fin, T.fin + 1.5) * (1 - prog(t, T.end - .6, T.end)));
  particles(t, cam);

  // ===== INTRO =====
  if (t < T.flash + 0.1) {
    const col = eInExpo(prog(t, T.collapse0, T.flash)); // collapse to centre
    const fadeL = 1 - prog(t, 4.0, T.collapse0) * 0.5;
    ctx.save();
    ctx.translate(540, 960); ctx.scale(1 - col * 0.98, 1); ctx.translate(-540, -960);
    lightLine(900, -80, 1160, prog(t, T.red0, T.red1), '255,40,70', SP.r, fadeL, 1);
    lightLine(1020, 1160, -80, prog(t, T.blue0, T.blue1), '50,140,255', SP.b, fadeL, -1);
    ctx.restore();
    // 3D rings on the bass hits
    const rings = [[T.hits[0], 300, 1.15, -0.3, '255,40,70'], [T.hits[1], 380, 1.25, 0.35, '50,140,255'], [T.hits[2], 460, 1.32, 0.0, '255,255,255']];
    rings.forEach(([th, R, tilt, rz, c], i) => {
      const k = prog(t, th - 0.05, th + 0.6);
      if (k <= 0) return;
      const a = eOutCubic(k) * (1 - col) * (0.75 + 0.25 * pulse(t, th, .02, .3));
      const rr = R * lerp(0.6, 1, eOutExpo(k)) * (1 - col * 0.9);
      ring3D(540, 960, rr, tilt + Math.sin(t * 0.6 + i) * 0.08, rz + t * 0.05 * (i % 2 ? -1 : 1), c, a, t * (1.4 + i * 0.3) + i * 2);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; spr(i === 0 ? SP.r : i === 1 ? SP.b : SP.w, 540, 960, 700, 0.35 * pulse(t, th, .02, .25)); ctx.restore();
    });
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    spr(SP.w, 540, 960, 300 + 900 * col, col * 0.9);
    flare(540, 960, 1400 * col, '255,255,255', col);
    ctx.restore();
  }

  // ===== LOGOS (reveal + collaboration) =====
  if (t >= T.flash - 0.05 && t < T.fin + 0.05) {
    const ku = eOutQuart(prog(t, T.ug0, T.ug1)), kn = eOutQuart(prog(t, T.nk0, T.nk1));
    const settle = prog(t, T.nk1 - 0.3, T.nk1 + 1);
    const swayU = 0.13 * Math.sin((t - 5) * 0.7) * settle, swayN = -0.13 * Math.sin((t - 5) * 0.7 + 0.6) * settle;
    const out = eInExpo(prog(t, T.wipe - 0.2, T.fin)); const vis = 1 - out;
    const fl = Math.sin(t * 1.1) * 7 * settle;
    const ux = lerp(-420, UGX, ku), nx = lerp(1500, NKX, kn);
    const hit = pulse(t, T.cross, .03, .5);
    // backlights
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    spr(SP.r, ux, LY, 1100, (0.22 + 0.25 * hit) * ku * vis);
    spr(SP.b, nx, LY, 1100, (0.25 + 0.25 * hit) * kn * vis);
    ctx.restore();
    const orb = prog(t, T.orb0, T.orb0 + 1.2) * vis;
    orbits(t, 540, LY, orb, false);
    // NOKSO light rings during entry
    if (kn > 0 && t < T.nk1 + 1) {
      const ra = Math.sin(Math.PI * prog(t, T.nk0, T.nk1 + 0.8)) * 0.9;
      ring3D(nx, LY, LS * 0.55, 1.15, -0.4, '50,140,255', ra, t * 5, 1.4);
      ring3D(nx, LY, LS * 0.6, 1.25, 0.5, '255,40,70', ra * 0.8, -t * 4 + 2, 1.4);
    }
    logo3D('ug', ux, LY + fl, LS * 0.92, { alpha: clamp(ku * 1.6) * vis, rotY: lerp(1.2, 0, ku) + swayU, blur: (1 - ku) * 22, glow: 0.45 + 0.35 * hit + 0.08 * Math.sin(t * 2),
      shine: prog(t, 6.55, 7.35) + prog(t, 10.2, 11.0) - (t > 10.2 ? 1 : 0) });
    logo3D('nk', nx, LY - fl, LS, { alpha: clamp(kn * 1.6) * vis, rotY: lerp(-1.2, 0, kn) + swayN, blur: (1 - kn) * 22, glow: 0.5 + 0.35 * hit + 0.08 * Math.sin(t * 2 + 1), depth: 0.06,
      shine: prog(t, 6.95, 7.75) + prog(t, 12.6, 13.4) - (t > 12.6 ? 1 : 0) });
    // ×
    const kx = prog(t, T.cross - 0.12, T.cross + 0.5);
    if (kx > 0) {
      const e = eOutExpo(kx);
      crossX(540, LY, 52 * lerp(2.6, 1, e), clamp(e * 1.5) * vis, 1 + 1.5 * hit);
      shock(540, LY, t, T.cross, 760, '255,255,255', 1.6, 4);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      spr(SP.w, 540, LY, 1000, 0.8 * pulse(t, T.cross, .02, .25));
      flare(540, LY, 1300, '120,170,255', 0.9 * pulse(t, T.cross, .02, .7));
      ctx.restore();
    }
    orbits(t, 540, LY, orb, true);

    // texts
    const ty = 1290;
    const L1 = 'UNE COLLABORATION', s1 = fit(L1, 92, 800, 0.02, 900);
    const p1in = prog(t, T.txt1, T.txt1 + 1.0), p1out = prog(t, T.txt1out, T.txt1out + 0.45);
    maskLine(L1, 540, ty, s1, 800, { tr: 0.02, pIn: p1in, pOut: p1out });
    maskLine('SE PRÉPARE', 540, ty + s1 * 1.05, 46, 300, { tr: 0.42, pIn: prog(t, T.txt1 + 0.35, T.txt1 + 1.4), pOut: prog(t, T.txt1out + 0.05, T.txt1out + 0.5), color: '#cfd6e6' });
    accentLine(540, ty + s1 * 1.75, 360, prog(t, T.txt1 + 0.6, T.txt1 + 1.6), 1 - prog(t, T.txt1out, T.txt1out + 0.4));

    maskLine('LE PROCHAIN JEU ROBLOX', 540, ty - 10, 40, 300, { tr: 0.3, pIn: prog(t, T.txt2, T.txt2 + 1.0), pOut: prog(t, T.txt2out, T.txt2out + 0.4), color: '#cfd6e6' });
    maskLine('DE NOKSO', 540, ty + 92, 132, 800, { tr: 0.03, pIn: prog(t, T.txt2 + 0.35, T.txt2 + 1.4), pOut: prog(t, T.txt2out + 0.05, T.txt2out + 0.45), colorAt: i => i >= 3 ? null : '#ffffff' });
    accentLine(540, ty + 190, 360, prog(t, T.txt2 + 0.7, T.txt2 + 1.7), 1 - prog(t, T.txt2out, T.txt2out + 0.4));
  }

  // light-wipe transition
  {
    const k = prog(t, T.wipe - 0.15, T.fin + 0.15);
    if (k > 0 && k < 1) {
      const x = lerp(-300, 1380, eInOut(k));
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(x - 260, 0, x + 260, 0);
      g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.4, 'rgba(255,40,70,0.35)'); g.addColorStop(0.5, 'rgba(255,255,255,0.9)'); g.addColorStop(0.6, 'rgba(50,140,255,0.35)'); g.addColorStop(1, 'rgba(50,140,255,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 260, -400, 520, 2720);
      ctx.restore();
    }
  }

  // ===== FINAL =====
  if (t >= T.fin - 0.05) {
    const k = eOutQuart(prog(t, T.fin, T.fin + 1.4));
    const fy = 660, fl = Math.sin(t * 1.1) * 5;
    const hit = pulse(t, T.final, .03, .7);
    const fade = 1 - prog(t, T.end - 0.7, T.end);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    spr(SP.r, 330, fy, 900, (0.2 + 0.3 * hit) * k * fade); spr(SP.b, 750, fy, 900, (0.22 + 0.3 * hit) * k * fade);
    ctx.restore();
    const sway = 0.1 * Math.sin((t - T.fin) * 0.8);
    logo3D('ug', lerp(200, 330, k), fy + fl, 320, { alpha: clamp(k * 1.5) * fade, rotY: lerp(0.9, 0, k) + sway, blur: (1 - k) * 16, glow: 0.4 + 0.5 * hit, shine: prog(t, T.final - 0.1, T.final + 0.7) });
    logo3D('nk', lerp(880, 750, k), fy - fl, 340, { alpha: clamp(k * 1.5) * fade, rotY: lerp(-0.9, 0, k) - sway, blur: (1 - k) * 16, glow: 0.45 + 0.5 * hit, depth: 0.06, shine: prog(t, T.final, T.final + 0.8) });
    crossX(540, fy, 38, eOutExpo(prog(t, T.fin + 0.5, T.fin + 1.1)) * fade, 1 + hit);

    const TT = 'UNITED GAMES × NOKSO', ts = fit(TT, 78, 800, 0.03, 940);
    maskLine(TT, 540, 1005, ts, 800, { tr: 0.03, pIn: prog(t, T.title, T.title + 1.1), alpha: fade, colorAt: i => i === 13 ? '#ff3355' : null });
    accentLine(540, 1075, 760, prog(t, T.title + 0.4, T.title + 1.6), fade);
    maskLine('NOKSO — CRÉATEUR DU JEU', 540, 1140, 40, 600, { tr: 0.12, pIn: prog(t, T.cred1, T.cred1 + 1), alpha: fade, colorAt: i => i < 5 ? '#ffffff' : '#dfe5f2' });
    maskLine('UNITED GAMES — PARTENAIRE', 540, 1198, 30, 400, { tr: 0.2, pIn: prog(t, T.cred2, T.cred2 + 1), alpha: 0.85 * fade, color: '#98a2b8' });

    // BIENTÔT… focus-pull
    const kb = prog(t, T.soon, T.soon + 1.6);
    if (kb > 0) {
      const e = eOutCubic(kb);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      spr(SP.r, 400, 1440, 640, (0.25 * e + 0.35 * hit) * fade); spr(SP.b, 680, 1440, 640, (0.25 * e + 0.35 * hit) * fade);
      ctx.restore();
      const tr = lerp(0.7, 0.2, eOutCubic(prog(t, T.soon, T.end)));
      const { ch, ws, total } = measure('BIENTÔT…', 124, 800, tr);
      ctx.save(); ctx.font = `800 124px ${FONT}`; ctx.textBaseline = 'middle';
      ctx.filter = `blur(${((1 - e) * 26 * RES).toFixed(1)}px)`;
      ctx.globalAlpha = clamp(e * 1.3) * fade; ctx.fillStyle = '#fff';
      let x = 540 - total / 2;
      for (let i = 0; i < ch.length; i++) { ctx.fillText(ch[i], x, 1440); x += ws[i] + tr * 124; }
      ctx.restore();
    }
    shock(540, 1000, t, T.final, 1150, '255,255,255', 1.8, 3);
    shock(540, 1000, t, T.final + 0.08, 900, '50,140,255', 1.6, 2);
    shock(540, 1000, t, T.final + 0.16, 1350, '255,40,70', 1.8, 2);
  }
  ctx.restore();

  // flashes
  const f = 0.9 * pulse(t, T.flash, .12, .2) + 0.35 * pulse(t, T.cross, .02, .18) + 0.6 * pulse(t, T.fin, .15, .25) + 0.3 * pulse(t, T.final, .03, .3);
  if (f > 0.003) {
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(540, 960, 0, 540, 960, 1300);
    g.addColorStop(0, `rgba(255,255,255,${f})`); g.addColorStop(1, `rgba(170,195,255,${f * 0.4})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  }
  post(t);
  // fades
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  const fb = Math.max(1 - prog(t, 0, 0.3), prog(t, T.end - 0.35, T.end));
  if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${fb})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  const [ug, nk] = await Promise.all([loadImg('assets/united.png'), loadImg('assets/nokso.png')]);
  await document.fonts.load(`800 80px "Inter Display"`); await document.fonts.load(`300 80px "Inter Display"`);
  await document.fonts.load(`600 80px "Inter Display"`); await document.fonts.load(`400 80px "Inter Display"`);
  const metal = (c1, c2) => g => { const gr = g.createLinearGradient(0, 0, 0, FS); gr.addColorStop(0, c1); gr.addColorStop(1, c2); return gr; };
  IMG.ug = { face: fitted(ug), side: fitted(ug, metal('#3a3e4a', '#121319')), sideHi: fitted(ug, metal('#c9cfdc', '#6e7484')) };
  IMG.nk = { face: fitted(nk), side: fitted(nk, metal('#1d4f9a', '#0a1730')), sideHi: fitted(nk, metal('#bfe0ff', '#4b8fe0')) };
  IMG.ug.glow = blurred(IMG.ug.face, '#ff2a50', 28); IMG.nk.glow = blurred(IMG.nk.face, '#2a8cff', 32);
  SP.r = sprite('#ff2244'); SP.b = sprite('#2b8cff'); SP.w = sprite('#ffffff');
  SP.bokR = softDisc('#ff3355'); SP.bokB = softDisc('#3a8cff');
  offFace.ug = mk(FS, FS); offFace.nk = mk(FS, FS);
  small1 = mk(Math.round(cv.width / 4), Math.round(cv.height / 4)); small2 = mk(Math.round(cv.width / 12), Math.round(cv.height / 12));
  const gc = mk(256, 256), gg = gc.getContext('2d'), id = gg.createImageData(256, 256), R = rng(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() - 0.5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gg.putImageData(id, 0, 0); grain = ctx.createPattern(gc, 'repeat');
  window.render = render;
  const qt = Q.get('t');
  if (qt) render(+qt);
  else { const st = performance.now(); (function loop() { render(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
  return true;
})();
</script>
